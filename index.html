<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>岡大キャンパスマップ（試作）</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css?v=0.4.1">
  <style>
    /* 画面全体にマップを広げる設定 */
    body { 
      margin: 0; 
      padding: 0; 
    }
    #map { 
      height: 100vh; 
      width: 100%; 
    }
  </style>
</head>
<body>
  <header id="top-bar">
    <div class="search-container">
      <input type="text" id="search-input" list="building-list" placeholder="建物名・施設名で検索">
      <button id="clear-btn" type="button" style="display: none;">✕</button>
      <datalist id="building-list">
        <!-- JSで検索候補を自動追加します -->
      </datalist>
      <button id="search-btn">検索</button>
    </div>
    <button id="toggle-etc-btn" class="category-btn active">
      <img src="icons/etc_2.png" alt="その他">
    </button>
    <button id="reset-btn" aria-label="初期表示に戻す">
      <img src="icons/update.png" alt="更新">
    </button>
  </header> 
  
  <!-- 地図を表示するエリア -->
  <div id="map"></div>

  <!-- LeafletのJavaScript本体 -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="script.js?v=0.4.1"></script>
</body>
</html>
